<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格林塔罗知识库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.8;
            color: #333;
            background: #fafafa;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* 左侧导航 */
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #eaeaea;
            padding: 20px 0;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 15px;
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: #2c3e50;
            font-weight: 600;
        }

        .nav-tree {
            list-style: none;
            padding: 0 10px;
        }

        .nav-item {
            margin: 5px 0;
        }

        .nav-folder {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            font-weight: 500;
            color: #444;
        }

        .nav-folder:hover {
            background: #f5f5f5;
        }

        .nav-folder.active {
            background: #e8f4fc;
            color: #1a73e8;
        }

        .nav-folder .icon {
            font-size: 12px;
            width: 16px;
            text-align: center;
        }

        .nav-folder .name {
            flex: 1;
        }

        .nav-folder .count {
            font-size: 11px;
            color: #999;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .nav-files {
            list-style: none;
            padding-left: 28px;
            display: none;
        }

        .nav-files.open {
            display: block;
        }

        .nav-file {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #555;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-file:hover {
            background: #f5f5f5;
        }

        .nav-file.active {
            background: #e8f4fc;
            color: #1a73e8;
        }

        .nav-file .icon {
            font-size: 12px;
            color: #999;
        }

        /* 右侧内容 */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px 60px;
            max-width: 900px;
        }

        .content-wrapper {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        /* 文件夹统计信息 */
        .folder-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #1a73e8;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        /* Markdown 内容样式 */
        .markdown-body {
            font-size: 16px;
            line-height: 1.8;
        }

        .markdown-body h1 {
            font-size: 28px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eaeaea;
            color: #2c3e50;
        }

        .markdown-body h2 {
            font-size: 22px;
            margin: 30px 0 15px;
            color: #2c3e50;
        }

        .markdown-body h3 {
            font-size: 18px;
            margin: 25px 0 12px;
            color: #34495e;
        }

        .markdown-body p {
            margin-bottom: 16px;
            text-align: justify;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 15px 0;
            padding-left: 25px;
        }

        .markdown-body li {
            margin: 8px 0;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #eaeaea;
            padding: 12px 15px;
            text-align: left;
        }

        .markdown-body th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }

        .markdown-body tr:nth-child(even) {
            background: #fafafa;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .markdown-body a {
            color: #1a73e8;
            text-decoration: none;
        }

        .markdown-body a:hover {
            text-decoration: underline;
        }

        .markdown-body code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
        }

        .markdown-body pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .markdown-body blockquote {
            border-left: 4px solid #1a73e8;
            padding-left: 20px;
            margin: 20px 0;
            color: #666;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
        }

        /* 欢迎页面 */
        .welcome-page {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-page h1 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 15px;
            border: none;
        }

        .welcome-page p {
            color: #666;
            font-size: 16px;
        }

        .welcome-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
            }

            .main-content {
                margin-left: 240px;
                padding: 20px 30px;
            }

            .content-wrapper {
                padding: 25px;
            }

            .folder-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>📚 格林塔罗知识库</h1>
            </div>
            <ul class="nav-tree" id="navTree">
                <!-- 导航由 JS 自动生成 -->
            </ul>
        </aside>

        <!-- 右侧内容 -->
        <main class="main-content">
            <div class="content-wrapper" id="contentWrapper">
                <div class="welcome-page">
                    <div class="welcome-icon">📋</div>
                    <h1>欢迎来到格林塔罗知识库</h1>
                    <p>请点击左侧导航浏览文档内容</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 知识库配置
        const CONFIG = {
            docsPath: 'docs/',
            imageBaseUrl: 'https://book.gtarot.top/assets/images/',
            githubRepo: 'yanghan616/ai-gt-test',
            githubBranch: 'main'
        };

        // 文档结构数据（由构建时生成）
        const DOCS_STRUCTURE = {
            "docs": []
        };

        // 当前状态
        let currentFolder = null;
        let currentFile = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadStructure();
            renderNavTree();
        });

        // 加载文档结构
        async function loadStructure() {
            try {
                // 尝试从 GitHub 加载结构文件
                const response = await fetch('docs/structure.json');
                if (response.ok) {
                    const data = await response.json();
                    DOCS_STRUCTURE.docs = data.docs || [];
                }
            } catch (e) {
                console.log('使用默认结构');
            }
            renderNavTree();
        }

        // 渲染导航树
        function renderNavTree() {
            const navTree = document.getElementById('navTree');
            navTree.innerHTML = '';

            if (!DOCS_STRUCTURE.docs || DOCS_STRUCTURE.docs.length === 0) {
                navTree.innerHTML = '<li class="nav-item"><div class="nav-file">暂无文档</div></li>';
                return;
            }

            DOCS_STRUCTURE.docs.forEach(folder => {
                const folderItem = document.createElement('li');
                folderItem.className = 'nav-item';

                const folderDiv = document.createElement('div');
                folderDiv.className = 'nav-folder';
                folderDiv.dataset.folder = folder.name;
                folderDiv.innerHTML = `
                    <span class="icon">▶</span>
                    <span class="name">${folder.displayName || folder.name}</span>
                    <span class="count">${folder.fileCount}篇</span>
                `;

                folderDiv.addEventListener('click', () => handleFolderClick(folder, folderDiv));

                const filesList = document.createElement('ul');
                filesList.className = 'nav-files';
                filesList.id = `folder-${folder.name}`;

                if (folder.files && folder.files.length > 0) {
                    folder.files.forEach(file => {
                        const fileItem = document.createElement('li');
                        const fileDiv = document.createElement('div');
                        fileDiv.className = 'nav-file';
                        fileDiv.dataset.file = file.name;
                        fileDiv.innerHTML = `
                            <span class="icon">📄</span>
                            <span>${file.displayName || file.name.replace('.md', '')}</span>
                        `;
                        fileDiv.addEventListener('click', () => handleFileClick(file, fileDiv));
                        fileItem.appendChild(fileDiv);
                        filesList.appendChild(fileItem);
                    });
                }

                folderItem.appendChild(folderDiv);
                folderItem.appendChild(filesList);
                navTree.appendChild(folderItem);
            });
        }

        // 处理文件夹点击
        function handleFolderClick(folder, element) {
            // 关闭所有其他文件夹
            document.querySelectorAll('.nav-folder').forEach(el => {
                if (el !== element) {
                    el.classList.remove('active');
                    el.querySelector('.icon').textContent = '▶';
                }
            });
            document.querySelectorAll('.nav-files').forEach(el => {
                if (el.id !== `folder-${folder.name}`) {
                    el.classList.remove('open');
                }
            });

            // 切换当前文件夹
            const isActive = element.classList.contains('active');
            const filesList = document.getElementById(`folder-${folder.name}`);

            if (isActive) {
                element.classList.remove('active');
                element.querySelector('.icon').textContent = '▶';
                filesList.classList.remove('open');
                currentFolder = null;
            } else {
                element.classList.add('active');
                element.querySelector('.icon').textContent = '▼';
                filesList.classList.add('open');
                currentFolder = folder;
                showFolderStats(folder);
            }
        }

        // 显示文件夹统计
        function showFolderStats(folder) {
            const contentWrapper = document.getElementById('contentWrapper');
            contentWrapper.innerHTML = `
                <div class="folder-stats">
                    <div class="stat-item">
                        <div class="stat-value">${folder.fileCount || 0}</div>
                        <div class="stat-label">文档总数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${folder.totalWords || 0}</div>
                        <div class="stat-label">总字数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${folder.lastUpdated || '-'}</div>
                        <div class="stat-label">最后更新</div>
                    </div>
                </div>
                <div class="markdown-body">
                    <h2>${folder.displayName || folder.name}</h2>
                    <p>该分类包含 ${folder.fileCount || 0} 篇文档，共计 ${folder.totalWords || 0} 字。</p>
                    <p>请点击左侧文件列表查看具体文档内容。</p>
                </div>
            `;
        }

        // 处理文件点击
        async function handleFileClick(file, element) {
            // 移除其他文件的高亮
            document.querySelectorAll('.nav-file').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentFile = file;

            // 加载并渲染文件内容
            await loadFileContent(file);
        }

        // 加载文件内容
        async function loadFileContent(file) {
            const contentWrapper = document.getElementById('contentWrapper');
            contentWrapper.innerHTML = '<div class="welcome-page"><p>加载中...</p></div>';

            try {
                const response = await fetch(`docs/${file.path}`);
                if (!response.ok) throw new Error('文件加载失败');
                
                const markdown = await response.text();
                const html = parseMarkdown(markdown);
                
                contentWrapper.innerHTML = `<div class="markdown-body">${html}</div>`;
            } catch (e) {
                contentWrapper.innerHTML = `
                    <div class="markdown-body">
                        <h2>加载失败</h2>
                        <p>无法加载文件：${file.name}</p>
                        <p>错误信息：${e.message}</p>
                    </div>
                `;
            }
        }

        // 简易 Markdown 解析器
        function parseMarkdown(md) {
            let html = md;

            // 标题
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

            // 粗体/斜体
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // 链接
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');

            // 图片
            html = html.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">');

            // 代码块
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
            html = html.replace(/`(.*?)`/g, '<code>$1</code>');

            // 引用
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');

            // 列表
            html = html.replace(/^\- (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

            // 表格（简易支持）
            html = parseTables(html);

            // 段落
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p><(h[1-6]|ul|ol|table|pre|blockquote)/g, '<$1');
            html = html.replace(/<(\/h[1-6]|\/ul|\/ol|\/table|\/pre|\/blockquote)><\/p>/g, '</$1>');
            html = html.replace(/<p><\/p>/g, '');

            return html;
        }

        // 解析表格
        function parseTables(html) {
            const lines = html.split('\n');
            let inTable = false;
            let tableHtml = '';
            let result = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('|') && line.endsWith('|')) {
                    if (!inTable) {
                        inTable = true;
                        tableHtml = '<table><tbody>';
                    }
                    
                    if (!line.match(/^\|\s*[-:|]+\s*\|$/)) {
                        const cells = line.split('|').filter(c => c.trim());
                        tableHtml += '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
                    }
                    
                    if (i === lines.length - 1 || !lines[i + 1].trim().startsWith('|')) {
                        tableHtml += '</tbody></table>';
                        result.push(tableHtml);
                        inTable = false;
                        tableHtml = '';
                    }
                } else {
                    if (inTable) {
                        tableHtml += '</tbody></table>';
                        result.push(tableHtml);
                        inTable = false;
                        tableHtml = '';
                    }
                    result.push(line);
                }
            }

            return result.join('\n');
        }
    </script>
</body>
</html>
